name: 功能与改进建议 / Feature request
description: 提出玩法、工具、文档或组织展示的改进建议 / Suggest an improvement
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        请在对应项目提建议并先搜索已有讨论；组织主页与公共配置建议可在 SlayTheCircle/.github 提出。
        Use the relevant project's repository and search existing discussions first.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 哪个场景中遇到困难，或什么体验可以改善？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议与预期效果 / Proposal and expected outcome
      description: 描述建议、预期体验，以及可能的取舍或影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充 / Alternatives and context
      description: 可附参考、草图或其他考虑过的方案；请注明第三方内容来源。
